plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false }
subprojects {
    apply plugin: 'java'
    apply plugin: 'net.minecraftforge.gradle'
    group = 'it.nuovoordine'
    version = '1.0.0'
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    minecraft { mappings channel: 'official', version: '1.20.1' }
    repositories { mavenCentral() }
    dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'; testImplementation 'junit:junit:4.13.2' }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    jar { finalizedBy 'reobfJar'; archiveBaseName = 'nuovo-ordine-' + project.name }
}
