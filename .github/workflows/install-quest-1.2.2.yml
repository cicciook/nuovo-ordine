name: Installa quest Brigadier fix 1.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-quest-1.2.2.yml'

permissions:
  contents: write

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile ClientEvents without Brigadier ABI linkage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/q122
          mkdir -p /tmp/q122/src/com/nuovoordine/quests \
            /tmp/q122/stubs/net/minecraftforge/api/distmarker \
            /tmp/q122/stubs/net/minecraftforge/client/event \
            /tmp/q122/stubs/net/minecraftforge/event \
            /tmp/q122/stubs/net/minecraftforge/eventbus/api \
            /tmp/q122/stubs/net/minecraftforge/fml/common \
            /tmp/q122/classes

          cat > /tmp/q122/stubs/net/minecraftforge/api/distmarker/Dist.java <<'EOF'
          package net.minecraftforge.api.distmarker;
          public enum Dist { CLIENT, DEDICATED_SERVER }
          EOF

          cat > /tmp/q122/stubs/net/minecraftforge/client/event/RegisterClientCommandsEvent.java <<'EOF'
          package net.minecraftforge.client.event;
          public class RegisterClientCommandsEvent { }
          EOF

          cat > /tmp/q122/stubs/net/minecraftforge/client/event/ClientPlayerNetworkEvent.java <<'EOF'
          package net.minecraftforge.client.event;
          public class ClientPlayerNetworkEvent { public static class LoggingOut extends ClientPlayerNetworkEvent {} }
          EOF

          cat > /tmp/q122/stubs/net/minecraftforge/event/TickEvent.java <<'EOF'
          package net.minecraftforge.event;
          public class TickEvent {
            public enum Phase { START, END }
            public static class ClientTickEvent extends TickEvent { public Phase phase; }
          }
          EOF

          cat > /tmp/q122/stubs/net/minecraftforge/eventbus/api/SubscribeEvent.java <<'EOF'
          package net.minecraftforge.eventbus.api;
          import java.lang.annotation.*;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.METHOD)
          public @interface SubscribeEvent { }
          EOF

          cat > /tmp/q122/stubs/net/minecraftforge/fml/common/Mod.java <<'EOF'
          package net.minecraftforge.fml.common;
          import java.lang.annotation.*;
          import net.minecraftforge.api.distmarker.Dist;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface Mod {
            String value() default "";
            @Retention(RetentionPolicy.RUNTIME)
            @Target(ElementType.TYPE)
            public @interface EventBusSubscriber {
              String modid() default "";
              Dist[] value() default {};
              Bus bus() default Bus.FORGE;
              public enum Bus { FORGE, MOD }
            }
          }
          EOF

          cat > /tmp/q122/src/com/nuovoordine/quests/ClientEvents.java <<'EOF'
          package com.nuovoordine.quests;

          import java.lang.reflect.*;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RegisterClientCommandsEvent;
          import net.minecraftforge.client.event.ClientPlayerNetworkEvent;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = "noquests", value = Dist.CLIENT,
                  bus = Mod.EventBusSubscriber.Bus.FORGE)
          public final class ClientEvents {
              private static boolean pendingOpen;
              private static boolean bridgeReady;
              private static long nextBridgeAttempt;

              private static void prepareBridgeEarly() {
                  if (bridgeReady) return;
                  long now = System.nanoTime();
                  if (now < nextBridgeAttempt) return;
                  nextBridgeAttempt = now + 250_000_000L;
                  try {
                      Class<?> mcef = Class.forName("com.cinemamod.mcef.MCEF");
                      if (!Boolean.TRUE.equals(mcef.getMethod("isInitialized").invoke(null))) return;
                      ShopBrowserClient.prepare();
                      bridgeReady = true;
                      System.getLogger("Quest Nuovo Ordine").log(System.Logger.Level.INFO,
                              "Bridge MCEF quest registrato in anticipo");
                  } catch (Throwable ignored) { }
              }

              @SubscribeEvent
              public static void registerCommands(RegisterClientCommandsEvent event) {
                  prepareBridgeEarly();
                  try {
                      Method getter = RegisterClientCommandsEvent.class.getMethod("getDispatcher");
                      Object dispatcher = getter.invoke(event);
                      register(dispatcher);
                  } catch (ReflectiveOperationException e) {
                      throw new IllegalStateException("Cannot register /quest", e);
                  }
              }

              static void register(Object dispatcher) throws ReflectiveOperationException {
                  Class<?> literalType = Class.forName("com.mojang.brigadier.builder.LiteralArgumentBuilder");
                  Object builder = literalType.getMethod("literal", String.class).invoke(null, "quest");
                  Class<?> commandType = Class.forName("com.mojang.brigadier.Command");
                  Object command = Proxy.newProxyInstance(commandType.getClassLoader(), new Class<?>[]{commandType},
                          (proxy, method, args) -> {
                              String name = method.getName();
                              if (name.equals("run")) {
                                  prepareBridgeEarly();
                                  pendingOpen = true;
                                  return 1;
                              }
                              if (name.equals("toString")) return "NuovoOrdineQuestCommand";
                              if (name.equals("hashCode")) return System.identityHashCode(proxy);
                              if (name.equals("equals")) return proxy == (args == null ? null : args[0]);
                              return null;
                          });
                  literalType.getMethod("executes", commandType).invoke(builder, command);

                  Method register = null;
                  for (Method candidate : dispatcher.getClass().getMethods()) {
                      if (!candidate.getName().equals("register") || candidate.getParameterCount() != 1) continue;
                      if (candidate.getParameterTypes()[0].isAssignableFrom(builder.getClass())) {
                          register = candidate;
                          break;
                      }
                  }
                  if (register == null) throw new NoSuchMethodException("Brigadier CommandDispatcher.register");
                  register.invoke(dispatcher, builder);
              }

              @SubscribeEvent
              public static void clientTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  prepareBridgeEarly();
                  ShopBrowserClient.tick();
                  ClientTransfer.tick();
                  if (!pendingOpen) return;
                  pendingOpen = false;
                  try {
                      prepareBridgeEarly();
                      ClientTransfer.request();
                  } catch (Exception | LinkageError e) {
                      Throwable cause = e;
                      while (cause instanceof InvocationTargetException && cause.getCause() != null)
                          cause = cause.getCause();
                      System.getLogger("Quest Nuovo Ordine").log(System.Logger.Level.ERROR,
                              "Impossibile aprire la quest", cause);
                      BrowserBridge.reportError("Quest Nuovo Ordine: " + cause.getClass().getSimpleName()
                              + ". Consulta logs/latest.log.");
                  }
              }

              @SubscribeEvent
              public static void logout(ClientPlayerNetworkEvent.LoggingOut event) {
                  pendingOpen = false;
                  ClientTransfer.cancel();
                  ShopBrowserClient.clear();
              }
          }
          EOF

          javac --release 17 \
            -cp mods/nuovo-ordine-quests-1.2.1.jar \
            -d /tmp/q122/classes \
            $(find /tmp/q122/stubs /tmp/q122/src -name '*.java')

      - name: Build quest jar 1.2.2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo

          src = Path('mods/nuovo-ordine-quests-1.2.1.jar')
          out = Path('mods/nuovo-ordine-quests-1.2.2.jar')
          replacement = Path('/tmp/q122/classes/com/nuovoordine/quests/ClientEvents.class').read_bytes()

          with ZipFile(src, 'r') as zin, ZipFile(out, 'w', ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  data = zin.read(info.filename)
                  if info.filename == 'com/nuovoordine/quests/ClientEvents.class':
                      data = replacement
                  elif info.filename == 'META-INF/mods.toml':
                      text = data.decode('utf-8').replace('version="1.2.1"', 'version="1.2.2"')
                      data = text.encode('utf-8')
                  zi = ZipInfo(info.filename, info.date_time)
                  zi.compress_type = ZIP_DEFLATED
                  zi.external_attr = info.external_attr
                  zi.comment = info.comment
                  zi.extra = info.extra
                  zout.writestr(zi, data)

          with ZipFile(out, 'r') as z:
              assert z.testzip() is None
              assert 'version="1.2.2"' in z.read('META-INF/mods.toml').decode('utf-8')
          src.unlink()
          PY

          unzip -t mods/nuovo-ordine-quests-1.2.2.jar >/dev/null
          javap -classpath mods/nuovo-ordine-quests-1.2.2.jar -p -c com.nuovoordine.quests.ClientEvents > /tmp/clientevents.txt
          if grep -q 'LiteralArgumentBuilder.executes' /tmp/clientevents.txt; then
            echo 'ERRORE: chiamata Brigadier fragile ancora presente' >&2
            exit 1
          fi
          if grep -q 'CommandDispatcher.register:' /tmp/clientevents.txt; then
            echo 'ERRORE: register Brigadier ancora collegato direttamente' >&2
            exit 1
          fi
          sha256sum mods/nuovo-ordine-quests-1.2.2.jar

      - name: Commit fixed jar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-quest-1.2.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix quest Brigadier ABI crash 1.2.2'
          git pull --rebase origin main
          git push origin main
