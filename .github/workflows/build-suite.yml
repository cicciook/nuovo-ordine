name: Nuovo Ordine suite - build and test
on:
  push:
    branches: [main, feature/market-cosmetics-towny-pvp]
    paths: ['projects/nuovo-ordine-suite/**', '.github/workflows/build-suite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon test build
        working-directory: projects/nuovo-ordine-suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuovo-ordine-suite
          path: |
            projects/nuovo-ordine-suite/*/build/libs/*.jar
            projects/nuovo-ordine-suite/*/build/reports/tests/test/**
          if-no-files-found: error
