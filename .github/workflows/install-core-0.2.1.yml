name: Install Nuovo Ordine Core 0.2.1

on:
  push:
    branches: [main]
    paths:
      - 'staging/core-0.2.1/**'
      - '.github/workflows/install-core-0.2.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble JAR
        run: |
          cat staging/core-0.2.1/part-*.b64 | tr -d '\n\r' | base64 -d > mods/nuovo-ordine-core-0.2.1.jar
          test -s mods/nuovo-ordine-core-0.2.1.jar
          echo "SHA256: $(sha256sum mods/nuovo-ordine-core-0.2.1.jar | cut -d' ' -f1)"

      - name: Commit Core 0.2.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/nuovo-ordine-core-0.2.1.jar
          git rm -r staging/core-0.2.1
          git rm .github/workflows/install-core-0.2.1.yml
          git commit -m "Add Nuovo Ordine Core 0.2.1"
          git push origin main
