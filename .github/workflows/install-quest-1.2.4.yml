name: Installa quest network fix 1.2.4

on:
  push:
    branches: [main]
    paths:
      - 'projects/quest-1.2.4/**'
      - '.github/workflows/install-quest-1.2.4.yml'

permissions:
  contents: write

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile network and MCEF bridge fix
        shell: bash
        run: |
          set -euo pipefail
          test -f mods/nuovo-ordine-quests-1.2.2.jar
          rm -rf /tmp/noq124
          mkdir -p /tmp/noq124/src/io/netty/buffer /tmp/noq124/classes
          cat >/tmp/noq124/src/io/netty/buffer/ByteBuf.java <<'EOF'
          package io.netty.buffer;
          public abstract class ByteBuf {
            public abstract ByteBuf writeLong(long v);
            public abstract ByteBuf writeInt(int v);
            public abstract ByteBuf writeBytes(byte[] v);
            public abstract long readLong();
            public abstract int readInt();
            public abstract ByteBuf readBytes(byte[] v);
            public abstract int readableBytes();
          }
          EOF
          javac --release 17 \
            -cp mods/nuovo-ordine-quests-1.2.2.jar \
            -d /tmp/noq124/classes \
            /tmp/noq124/src/io/netty/buffer/ByteBuf.java \
            projects/quest-1.2.4/Network.java \
            projects/quest-1.2.4/ShopBrowserClient.java

      - name: Assemble 1.2.4 JAR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json

          src=Path('mods/nuovo-ordine-quests-1.2.2.jar')
          out=Path('mods/nuovo-ordine-quests-1.2.4.jar')
          classes=Path('/tmp/noq124/classes/com/nuovoordine/quests')
          sources=Path('projects/quest-1.2.4')

          with ZipFile(src) as zin, ZipFile(out,'w',ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  n=item.filename
                  if n.endswith('.class') and (n.startswith('com/nuovoordine/quests/Network') or n.startswith('com/nuovoordine/quests/ShopBrowserClient')):
                      continue
                  if n in ('META-INF/quest-sources/com/nuovoordine/quests/Network.java',
                           'META-INF/quest-sources/com/nuovoordine/quests/ShopBrowserClient.java'):
                      continue
                  data=zin.read(n)
                  if n == 'META-INF/mods.toml':
                      text=data.decode('utf-8')
                      text=text.replace('version="1.2.2"','version="1.2.4"')
                      text=text.replace('version="1.2.3"','version="1.2.4"')
                      text=text.replace('description="Quest giornaliere e settimanali Lootr/PvP con GUI web, bridge MCEF, bonus e ricompense TNE."',
                                        'description="Quest giornaliere e settimanali Lootr/PvP con GUI web, bridge MCEF e risposta server diretta PacketDistributor per Forge/Mohist/Connector."')
                      data=text.encode('utf-8')
                  zout.writestr(item,data)
              for pattern in ('Network*.class','ShopBrowserClient*.class'):
                  for f in sorted(classes.glob(pattern)):
                      zout.write(f,'com/nuovoordine/quests/'+f.name)
              zout.writestr('META-INF/quest-sources/com/nuovoordine/quests/Network.java',(sources/'Network.java').read_bytes())
              zout.writestr('META-INF/quest-sources/com/nuovoordine/quests/ShopBrowserClient.java',(sources/'ShopBrowserClient.java').read_bytes())

          # Verify archive and metadata.
          with ZipFile(out) as z:
              assert z.testzip() is None
              mods=z.read('META-INF/mods.toml').decode('utf-8')
              assert 'version="1.2.4"' in mods
              net=z.read('com/nuovoordine/quests/Network.class')
              assert b'PacketDistributor' in net and b'Risposta /quest inviata al client' in net
              bridge=z.read('com/nuovoordine/quests/ShopBrowserClient.class')
              assert b'Bridge /quest 1.2.4 pronto' in bridge

          size=out.stat().st_size
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          print('JAR',size,sha)

          p=Path('pack-settings.json')
          cfg=json.loads(p.read_text('utf-8'))
          files=[x for x in cfg.get('external_files',[]) if not x.get('path','').startswith('mods/nuovo-ordine-quests-')]
          files.append({
              'path':'mods/nuovo-ordine-quests-1.2.4.jar',
              'size':size,
              'sha256':sha,
              'mode':'replace',
              'url':'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/nuovo-ordine-quests-1.2.4.jar'
          })
          cfg['external_files']=files
          cfg['news']='Nuovo Ordine — Quest 1.2.4: corretto timeout bridge /quest lato server'
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY
          rm -f mods/nuovo-ordine-quests-1.2.2.jar mods/nuovo-ordine-quests-1.2.1.jar mods/nuovo-ordine-quests-1.1.0.jar

      - name: Commit built mod and launcher manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/ pack-settings.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Fix /quest server reply timeout 1.2.4'
          git push
