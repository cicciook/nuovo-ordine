name: Installa quest bridge fix 1.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-quest-1.2.1.yml'

permissions:
  contents: write

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched quest jar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          import struct, base64

          src=Path('mods/nuovo-ordine-quests-1.1.0.jar')
          out=Path('/tmp/nuovo-ordine-quests-1.2.1.jar')
          client_events_b64=''''''
          replacement=base64.b64decode(client_events_b64)

          def patch_utf8(data, replacements):
              if data[:4] != b'\xca\xfe\xba\xbe':
                  raise ValueError('class file non valido')
              cp_count=struct.unpack('>H', data[8:10])[0]
              pos=10
              result=bytearray(data[:10])
              i=1
              while i < cp_count:
                  tag=data[pos]; result.append(tag); pos += 1
                  if tag == 1:
                      length=struct.unpack('>H',data[pos:pos+2])[0]
                      raw=data[pos+2:pos+2+length]
                      raw=replacements.get(raw,raw)
                      result += struct.pack('>H',len(raw)) + raw
                      pos += 2 + length
                  elif tag in (3,4): result += data[pos:pos+4]; pos += 4
                  elif tag in (5,6): result += data[pos:pos+8]; pos += 8; i += 1
                  elif tag in (7,8,16,19,20): result += data[pos:pos+2]; pos += 2
                  elif tag in (9,10,11,12,17,18): result += data[pos:pos+4]; pos += 4
                  elif tag == 15: result += data[pos:pos+3]; pos += 3
                  else: raise ValueError(f'tag constant pool sconosciuto {tag}')
                  i += 1
              result += data[pos:]
              return bytes(result)

          with ZipFile(src,'r') as zin, ZipFile(out,'w',ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename == 'com/nuovoordine/quests/SiteArchive.class':
                      data=patch_utf8(data,{b'noquests':b'quest'})
                  elif info.filename == 'com/nuovoordine/quests/ClientEvents.class':
                      data=replacement
                  elif info.filename == 'META-INF/mods.toml':
                      text=data.decode('utf-8').replace('version="1.1.0"','version="1.2.1"')
                      text=text.replace('Quest giornaliere e settimanali Lootr/PvP con GUI web, bonus e ricompense TNE.',
                                        'Quest Lootr/PvP con GUI web server/quest e bridge MCEF registrato in anticipo.')
                      data=text.encode('utf-8')
                  zi=ZipInfo(info.filename,info.date_time)
                  zi.compress_type=ZIP_DEFLATED
                  zi.external_attr=info.external_attr
                  zi.comment=info.comment
                  zi.extra=info.extra
                  zout.writestr(zi,data)

          with ZipFile(out,'r') as z:
              assert z.testzip() is None
              assert b'prepareBridgeEarly' in z.read('com/nuovoordine/quests/ClientEvents.class')
              assert 'version="1.2.1"' in z.read('META-INF/mods.toml').decode('utf-8')
          PY
          unzip -t /tmp/nuovo-ordine-quests-1.2.1.jar
          sha256sum /tmp/nuovo-ordine-quests-1.2.1.jar

      - name: Install jar in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          rm -f mods/nuovo-ordine-quests-1.1.0.jar mods/nuovo-ordine-quests-1.2.0.jar
          cp /tmp/nuovo-ordine-quests-1.2.1.jar mods/nuovo-ordine-quests-1.2.1.jar
          git add -A mods
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da pubblicare'
          else
            git commit -m 'Aggiorna Nuovo Ordine Quests a 1.2.1'
            git push origin main
          fi
