name: Remove gundb from pack manifest

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-gundb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Gun Durability from pack.json
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path("pack.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          target = "mods/gundb-2.2.2-1.20.1.jar"
          original = data.get("files", [])
          matches = [item for item in original if item.get("path") == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {target} entry, found {len(matches)}")

          data["files"] = [item for item in original if item.get("path") != target]
          if data.get("version") == "2026.09.29-ext-12":
              data["version"] = "2026.09.29-ext-13"
          data["news"] = "Nuovo Ordine — rimosso Gun Durability (gundb) per incompatibilità con TACZ"
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit manifest update and remove one-time workflow
        run: |
          if grep -Fq 'mods/gundb-2.2.2-1.20.1.jar' pack.json; then
            echo 'gundb is still present in pack.json' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-gundb-once.yml
          git add pack.json
          git commit -m "fix: remove gundb from modpack"
          git push origin HEAD:main
