name: Compila launcher
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['launcher-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.3.5
      - run: python -m pytest -q
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: NuovoOrdine-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release launcher v'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pubblica eseguibili
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(python -c "from launcher import VERSION; print(VERSION)")
            RELEASE_TAG="launcher-v$VERSION"
          fi
          gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --title "Nuovo Ordine $RELEASE_TAG" --notes "Launcher Nuovo Ordine per Windows, macOS e Linux. Supporta accesso Microsoft per il gioco online e modalità offline senza login. Estrarre l'intero archivio."
