name: Compila launcher
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['launcher-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inserisci configurazione Microsoft della build
        env:
          MSA_CLIENT_ID: ${{ vars.NUOVO_ORDINE_MSA_CLIENT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('launcher-config.json')
          cfg = json.loads(path.read_text('utf-8'))
          client_id = os.environ.get('MSA_CLIENT_ID', '').strip()
          if client_id:
              cfg['microsoft_client_id'] = client_id
              path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('Client ID Microsoft incluso nella build.')
          else:
              print('NUOVO_ORDINE_MSA_CLIENT_ID non configurato: build con sola modalità offline.')
          PY
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.3.5
      - run: python -m pytest -q
      - run: python tools/build.py
      - name: Crea installer Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from launcher import VERSION; print(VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\NuovoOrdine" "/DOutputDir=$PWD\dist" "/DArch=amd64" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NuovoOrdine-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release launcher v'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pubblica eseguibili
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(python -c "from launcher import VERSION; print(VERSION)")
            RELEASE_TAG="launcher-v$VERSION"
          fi
          gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --title "Nuovo Ordine $RELEASE_TAG" --notes-file .github/launcher-release-notes.md
