name: Ispeziona bytecode Lootr 1.1.20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-loot-1.1.20.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump bytecode
        run: |
          javap -classpath mods/lootr-more-tactical-loot-1.1.20.jar -p -c -constants             com.cicciook.lootrmoreloot.LootOpenEvents > loot-1.1.20-javap.txt
      - name: Commit dump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loot-1.1.20-javap.txt
          git commit -m 'Ispeziona bytecode Lootr 1.1.20'
          git push origin HEAD:main
