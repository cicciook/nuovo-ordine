name: Sostituisci Simple Voice Chat 2.4.32

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-voicechat-2.4.32.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica il JAR ufficiale richiesto
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mediafilez.forgecdn.net/files/4961/385/voicechat-forge-1.20.1-2.4.32.jar'
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o /tmp/voicechat.jar
          test "$(stat -c '%s' /tmp/voicechat.jar)" = '7660001'
          echo 'f5eca8463dedfdcddf33efe9cd8de68887a795cb02bd50247c716c06b8e29b28  /tmp/voicechat.jar' | sha256sum -c -
          unzip -t /tmp/voicechat.jar >/dev/null

      - name: Sostituisci Voice Chat nel manifest attivo e nella configurazione sorgente
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          new_item = {
              'path': 'mods/voicechat-forge-1.20.1-2.4.32.jar',
              'size': 7660001,
              'sha256': 'f5eca8463dedfdcddf33efe9cd8de68887a795cb02bd50247c716c06b8e29b28',
              'mode': 'replace',
              'url': 'https://mediafilez.forgecdn.net/files/4961/385/voicechat-forge-1.20.1-2.4.32.jar',
          }

          manifest_path = Path('pack.json')
          manifest = json.loads(manifest_path.read_text('utf-8'))
          files = manifest['files']
          positions = [i for i, item in enumerate(files)
                       if item.get('path', '').startswith('mods/voicechat-') and item.get('path', '').endswith('.jar')]
          if not positions:
              raise SystemExit('Nessun Simple Voice Chat presente in pack.json')
          insert_at = min(positions)
          old = [files[i]['path'] for i in positions]
          files = [item for item in files
                   if not (item.get('path', '').startswith('mods/voicechat-') and item.get('path', '').endswith('.jar'))]
          files.insert(insert_at, dict(new_item))
          manifest['files'] = files
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Rimosso:', ', '.join(old))
          print('Aggiunto:', new_item['path'])

          settings_path = Path('pack-settings.json')
          settings = json.loads(settings_path.read_text('utf-8'))
          external = [item for item in settings.get('external_files', [])
                      if not (item.get('path', '').startswith('mods/voicechat-') and item.get('path', '').endswith('.jar'))]
          external.append(dict(new_item))
          settings['external_files'] = external
          settings_path.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          import_path = Path('tools/import_drive.py')
          source = import_path.read_text('utf-8')
          needle = '            if name in EXCLUDE:\n                continue\n'
          replacement = needle + "            if name.startswith('mods/voicechat-') and name.endswith('.jar'):\n                continue\n"
          if "name.startswith('mods/voicechat-')" not in source:
              if needle not in source:
                  raise SystemExit('Punto di patch non trovato in tools/import_drive.py')
              source = source.replace(needle, replacement, 1)
              import_path.write_text(source, encoding='utf-8')
          PY

      - name: Verifica manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('pack.json').read_text('utf-8'))
          v=[x for x in m['files'] if x.get('path','').startswith('mods/voicechat-') and x.get('path','').endswith('.jar')]
          assert len(v)==1, v
          assert v[0]['path']=='mods/voicechat-forge-1.20.1-2.4.32.jar', v
          assert v[0]['size']==7660001, v
          assert v[0]['sha256']=='f5eca8463dedfdcddf33efe9cd8de68887a795cb02bd50247c716c06b8e29b28', v
          print(v[0])
          PY

      - name: Pubblica la sostituzione
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pack.json pack-settings.json tools/import_drive.py
          if git diff --cached --quiet; then
            echo 'Nessuna modifica necessaria'
            exit 0
          fi
          git commit -m 'Replace Simple Voice Chat with Forge 2.4.32'
          git pull --rebase origin main
          git push origin HEAD:main
