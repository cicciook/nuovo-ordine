name: Sincronizza file esterni del modpack

on:
  push:
    branches: [main]
    paths:
      - 'pack-settings.json'
      - 'kubejs/server_scripts/nuovo_ordine_respawn_kit.js'
      - '.github/quest-upload/**'
      - '.github/workflows/sync-external-files.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installa aggiornamento quest mod
        shell: bash
        run: |
          if compgen -G '.github/quest-upload/part*.b64' > /dev/null; then
            mkdir -p mods
            cat .github/quest-upload/part*.b64 | base64 --decode > mods/nuovo-ordine-quests-1.1.0.jar
            echo '7fbe46299aaaa53e3c1d670abe730924d56ffa9d9d2efc2e3b617e2e92494817  mods/nuovo-ordine-quests-1.1.0.jar' | sha256sum -c -
            rm -f mods/nuovo-ordine-quests-1.0.0.jar
            rm -f .github/quest-upload/part*.b64
            echo "QUEST_UPLOAD_ACTIVE=1" >> "$GITHUB_ENV"

            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('pack-settings.json')
          settings = json.loads(path.read_text('utf-8'))

          quest_item = {
              'path': 'mods/nuovo-ordine-quests-1.1.0.jar',
              'size': 92010,
              'sha256': '7fbe46299aaaa53e3c1d670abe730924d56ffa9d9d2efc2e3b617e2e92494817',
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/nuovo-ordine-quests-1.1.0.jar',
          }

          external = []
          replaced = False
          for item in settings.get('external_files', []):
              p = item.get('path', '')
              if p.startswith('mods/nuovo-ordine-quests-') and p.endswith('.jar'):
                  if not replaced:
                      external.append(quest_item)
                      replaced = True
              else:
                  external.append(item)
          if not replaced:
              external.append(quest_item)

          settings['external_files'] = external
          settings['news'] = 'Benvenuto su Nuovo Ordine — quest giornaliere e settimanali aggiornate'
          path.write_text(
              json.dumps(settings, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          fi

      - name: Aggiorna hash, URL e pack.json dei file esterni
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          pack_path = Path('pack.json')
          settings_path = Path('pack-settings.json')
          pack = json.loads(pack_path.read_text('utf-8'))
          settings = json.loads(settings_path.read_text('utf-8'))

          repo = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          raw_prefix = f'https://raw.githubusercontent.com/{repo}/'
          upload_active = os.environ.get('QUEST_UPLOAD_ACTIVE') == '1'
          quest_upload_path = 'mods/nuovo-ordine-quests-1.1.0.jar'

          old_external = settings.get('external_files', [])
          external = []
          for configured in old_external:
              item = dict(configured)
              rel = item['path']
              local = Path(rel)

              # Se il file esterno vive nello stesso repository, hash e dimensione
              # vengono calcolati dai byte reali del checkout. In questo modo il
              # manifest non può restare con un checksum vecchio.
              if local.is_file():
                  configured_hash = str(item.get('sha256', '')).lower()
                  data = local.read_bytes()
                  actual_hash = hashlib.sha256(data).hexdigest()
                  item['size'] = len(data)
                  item['sha256'] = actual_hash

                  # Gli URL raw dello stesso repository vengono fissati a un commit.
                  # Durante il primo passaggio della quest mod il JAR viene creato
                  # nel workspace e non esiste ancora nel commit di trigger: in quel
                  # solo caso manteniamo temporaneamente il ref main.
                  url = item.get('url', '')
                  if url.startswith(raw_prefix):
                      rest = url[len(raw_prefix):]
                      ref, sep, remote_path = rest.partition('/')
                      immutable_ref = bool(re.fullmatch(r'[0-9a-fA-F]{40}', ref))
                      can_pin = not (upload_active and rel == quest_upload_path)
                      if can_pin and sep and remote_path == rel and (not immutable_ref or configured_hash != actual_hash):
                          item['url'] = f'{raw_prefix}{commit}/{rel}'

              external.append(item)

          settings_changed = external != old_external
          if settings_changed:
              settings['external_files'] = external
              settings_path.write_text(
                  json.dumps(settings, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          # Quando viene scelta una nuova versione di quest, loot o Ammo Compat,
          # rimuove dal manifest le versioni precedenti per evitare JAR duplicati.
          quest_paths = {
              item['path']
              for item in external
              if re.fullmatch(r'mods/nuovo-ordine-quests-[^/]+\.jar', item['path'])
          }
          loot_paths = {
              item['path']
              for item in external
              if re.fullmatch(r'mods/lootr-more-tactical-loot-[^/]+\.jar', item['path'])
          }
          ammo_compat_paths = {
              item['path']
              for item in external
              if re.fullmatch(r'mods/ammocompat-[^/]+\.jar', item['path'])
          }

          excluded = set(settings.get('exclude_paths', []))
          current_files = [
              item for item in pack.get('files', [])
              if item.get('path') not in excluded
          ]
          if quest_paths:
              current_files = [
                  item for item in current_files
                  if (
                      not re.fullmatch(r'mods/nuovo-ordine-quests-[^/]+\.jar', item.get('path', ''))
                      or item.get('path') in quest_paths
                  )
              ]
          if loot_paths:
              current_files = [
                  item for item in current_files
                  if (
                      not re.fullmatch(r'mods/lootr-more-tactical-loot-[^/]+\.jar', item.get('path', ''))
                      or item.get('path') in loot_paths
                  )
              ]
          if ammo_compat_paths:
              current_files = [
                  item for item in current_files
                  if (
                      not re.fullmatch(r'mods/ammocompat-[^/]+\.jar', item.get('path', ''))
                      or item.get('path') in ammo_compat_paths
                  )
              ]

          by_path = {item['path']: item for item in current_files}
          for item in external:
              by_path[item['path']] = item

          # Mantiene l'ordine precedente e aggiunge/sostituisce i file esterni.
          ordered = []
          seen = set()
          for item in current_files:
              path = item['path']
              ordered.append(by_path[path])
              seen.add(path)
          for item in external:
              if item['path'] not in seen:
                  ordered.append(item)
                  seen.add(item['path'])

          new_news = settings.get('news', pack.get('news', ''))
          manifest_changed = ordered != pack.get('files', []) or new_news != pack.get('news', '')
          if manifest_changed:
              pack['files'] = ordered
              run = os.environ.get('GITHUB_RUN_NUMBER', '1')
              pack['version'] = datetime.now(timezone.utc).strftime('%Y.%m.%d') + '-ext-' + run
              pack['news'] = new_news
              pack_path.write_text(
                  json.dumps(pack, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Pubblica manifest aggiornato
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'Manifest e file esterni già aggiornati.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna manifest e file esterni'
          git push
