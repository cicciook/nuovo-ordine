name: Sincronizza file esterni del modpack

on:
  push:
    branches: [main]
    paths:
      - 'pack-settings.json'
      - '.github/workflows/sync-external-files.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna hash, URL e pack.json dei file esterni
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          pack_path = Path('pack.json')
          settings_path = Path('pack-settings.json')
          pack = json.loads(pack_path.read_text('utf-8'))
          settings = json.loads(settings_path.read_text('utf-8'))

          repo = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          raw_prefix = f'https://raw.githubusercontent.com/{repo}/'

          old_external = settings.get('external_files', [])
          external = []
          for configured in old_external:
              item = dict(configured)
              rel = item['path']
              local = Path(rel)

              # Se il file esterno vive nello stesso repository, hash e dimensione
              # vengono calcolati dai byte reali del checkout. In questo modo il
              # manifest non può restare con un checksum vecchio.
              if local.is_file():
                  data = local.read_bytes()
                  item['size'] = len(data)
                  item['sha256'] = hashlib.sha256(data).hexdigest()

                  # Un URL raw che punta a main è mutabile: dopo una modifica del
                  # file il vecchio checksum non corrisponde più. Lo fissiamo al
                  # commit corrente. Un URL già fissato a un SHA viene lasciato
                  # invariato, così il workflow non crea un loop di commit.
                  url = item.get('url', '')
                  if url.startswith(raw_prefix):
                      rest = url[len(raw_prefix):]
                      ref, sep, remote_path = rest.partition('/')
                      if sep and remote_path == rel and not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                          item['url'] = f'{raw_prefix}{commit}/{rel}'

              external.append(item)

          settings_changed = external != old_external
          if settings_changed:
              settings['external_files'] = external
              settings_path.write_text(
                  json.dumps(settings, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          by_path = {item['path']: item for item in pack.get('files', [])}
          for item in external:
              by_path[item['path']] = item

          # Mantiene l'ordine precedente e aggiunge/sostituisce i file esterni.
          ordered = []
          seen = set()
          for item in pack.get('files', []):
              path = item['path']
              ordered.append(by_path[path])
              seen.add(path)
          for item in external:
              if item['path'] not in seen:
                  ordered.append(item)
                  seen.add(item['path'])

          new_news = settings.get('news', pack.get('news', ''))
          manifest_changed = ordered != pack.get('files', []) or new_news != pack.get('news', '')
          if manifest_changed:
              pack['files'] = ordered
              run = os.environ.get('GITHUB_RUN_NUMBER', '1')
              pack['version'] = datetime.now(timezone.utc).strftime('%Y.%m.%d') + '-ext-' + run
              pack['news'] = new_news
              pack_path.write_text(
                  json.dumps(pack, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Pubblica manifest aggiornato
        shell: bash
        run: |
          if git diff --quiet -- pack.json pack-settings.json; then
            echo 'Manifest e file esterni già aggiornati.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pack.json pack-settings.json
          git commit -m 'Aggiorna manifest con hash file esterni'
          git push
