name: Import uploaded mods

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-uploaded-mods.yml'

permissions:
  contents: write

jobs:
  import-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact releases and verify uploaded hashes
        shell: python
        run: |
          import hashlib, html, json, pathlib, re, urllib.request

          ROOT = pathlib.Path('.')
          MODS = ROOT / 'mods'
          MODS.mkdir(exist_ok=True)
          UA = {'User-Agent': 'Mozilla/5.0 NuovoOrdine-PackBot/1.0'}

          expected = {
              'taczadditions-1.20.1-1.3.5.jar': (276349, 'd1f6d127647ce89330e91c2cc970effaa2af606d6092879a28b41247f601dcb7'),
              'nomindlessshooting-2.3.0-1.20.1.jar': (26558, '1276b219c3c4cf0a96d22b8ebf6cdc4b6f6d7f825c08ba79609fd91aff9c2154'),
              'doxlean-1.3.0.jar': (41963, 'fd931d4fe0ab64e2c31407fb89436e1b7bb7e6d2fa03db33a81158a0f1b6d540'),
          }

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read(), r.geturl()

          def discover_file_id(slugs, filename):
              for slug in slugs:
                  url = f'https://www.curseforge.com/minecraft/mc-mods/{slug}/files/all?page=1&pageSize=50'
                  try:
                      raw, _ = get(url)
                  except Exception as e:
                      print(f'Could not read {url}: {e}')
                      continue
                  text = html.unescape(raw.decode('utf-8', 'ignore'))
                  pos = text.find(filename)
                  print(f'{slug}: filename position={pos}')
                  if pos < 0:
                      continue
                  candidates = []
                  for m in re.finditer(r'/files/(\d+)', text):
                      distance = abs(m.start() - pos)
                      if distance < 20000:
                          candidates.append((distance, m.group(1)))
                  if candidates:
                      candidates.sort()
                      print(f'{filename}: closest file id candidates={candidates[:5]}')
                      return candidates[0][1], slug
              return None, None

          def curseforge(project_id, slugs, filename, file_id=None):
              slug = slugs[0]
              if not file_id:
                  file_id, found_slug = discover_file_id(slugs, filename)
                  if found_slug:
                      slug = found_slug
              if not file_id:
                  raise RuntimeError(f'Could not discover CurseForge file id for {filename}')
              urls = [
                  f'https://www.curseforge.com/api/v1/mods/{project_id}/files/{file_id}/download',
                  f'https://www.curseforge.com/minecraft/mc-mods/{slug}/files/{file_id}/download',
              ]
              errors = []
              for url in urls:
                  try:
                      data, final = get(url)
                      print(f'{filename}: downloaded via {final}, bytes={len(data)}')
                      if data.startswith(b'PK'):
                          return data
                      errors.append(f'non-JAR response from {url}')
                  except Exception as e:
                      errors.append(f'{url}: {e}')
              raise RuntimeError('; '.join(errors))

          downloads = {
              'taczadditions-1.20.1-1.3.5.jar': curseforge(1356005, ['tacz-additions'], 'taczadditions-1.20.1-1.3.5.jar'),
              'nomindlessshooting-2.3.0-1.20.1.jar': curseforge(1365056, ['no-mindless-shooting'], 'nomindlessshooting-2.3.0-1.20.1.jar', '8745798'),
              'doxlean-1.3.0.jar': curseforge(1619996, ['doxleaning-tacz-recommendation', 'doxleaning'], 'doxlean-1.3.0.jar'),
          }

          for name, data in downloads.items():
              size = len(data)
              sha = hashlib.sha256(data).hexdigest()
              exp_size, exp_sha = expected[name]
              print(f'{name}: size={size} sha256={sha}')
              if size != exp_size or sha != exp_sha:
                  raise RuntimeError(f'{name} differs from the uploaded JAR; refusing to publish')
              (MODS / name).write_bytes(data)

          entries = [
              {
                  'path': f'mods/{name}',
                  'url': f'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/{name}',
                  'size': size,
                  'sha256': sha,
              }
              for name, (size, sha) in expected.items()
          ]

          settings_path = ROOT / 'pack-settings.json'
          settings = json.loads(settings_path.read_text(encoding='utf-8'))
          ext = settings.setdefault('external_files', [])
          by_path = {e.get('path'): e for e in ext if isinstance(e, dict)}
          for e in entries:
              if e['path'] in by_path:
                  by_path[e['path']].update(e)
              else:
                  ext.append(e)
          settings_path.write_text(json.dumps(settings, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = ROOT / 'pack.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.setdefault('files', [])
          by_path = {e.get('path'): e for e in files if isinstance(e, dict)}
          for e in entries:
              me = {**e, 'mode': 'replace'}
              if e['path'] in by_path:
                  by_path[e['path']].update(me)
              else:
                  files.append(me)
          manifest['version'] = '2026.09.30-mods-1'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

      - name: Commit mods and launcher manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/taczadditions-1.20.1-1.3.5.jar \
                  mods/nomindlessshooting-2.3.0-1.20.1.jar \
                  mods/doxlean-1.3.0.jar \
                  pack-settings.json pack.json
          git rm .github/workflows/import-uploaded-mods.yml
          git commit -m "feat: add TaCZ Additions, No Mindless Shooting and DoxLean"
          git push
