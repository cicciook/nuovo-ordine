name: Import uploaded mods

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-uploaded-mods.yml'

permissions:
  contents: write

jobs:
  import-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact public releases and verify uploaded hashes
        shell: python
        run: |
          import hashlib, html, json, os, pathlib, re, urllib.parse, urllib.request

          ROOT = pathlib.Path('.')
          MODS = ROOT / 'mods'
          MODS.mkdir(exist_ok=True)
          UA = {'User-Agent': 'NuovoOrdine-PackBot/1.0'}

          expected = {
              'taczadditions-1.20.1-1.3.5.jar': (276349, 'd1f6d127647ce89330e91c2cc970effaa2af606d6092879a28b41247f601dcb7'),
              'nomindlessshooting-2.3.0-1.20.1.jar': (26558, '1276b219c3c4cf0a96d22b8ebf6cdc4b6f6d7f825c08ba79609fd91aff9c2154'),
              'doxlean-1.3.0.jar': (41963, 'fd931d4fe0ab64e2c31407fb89436e1b7bb7e6d2fa03db33a81158a0f1b6d540'),
          }

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read(), r.geturl()

          def modrinth(project, filename):
              raw, _ = get(f'https://api.modrinth.com/v2/project/{project}/version')
              versions = json.loads(raw)
              for v in versions:
                  for f in v.get('files', []):
                      if f.get('filename') == filename:
                          data, _ = get(f['url'])
                          return data
              raise RuntimeError(f'Modrinth file not found: {filename}')

          def curseforge_doxlean(filename):
              pages = [
                  'https://www.curseforge.com/minecraft/mc-mods/doxleaning-tacz-recommendation/files/all?page=1&pageSize=50',
                  'https://www.curseforge.com/minecraft/mc-mods/doxleaning/files/all?page=1&pageSize=50',
              ]
              file_id = None
              chosen_base = None
              for page in pages:
                  try:
                      raw, final = get(page)
                  except Exception:
                      continue
                  text = raw.decode('utf-8', 'ignore')
                  pos = text.find(filename)
                  if pos < 0:
                      continue
                  window = text[max(0, pos-5000):pos+5000]
                  ids = re.findall(r'/files/(\d+)', window)
                  if ids:
                      file_id = ids[-1] if '/files/'+ids[-1] in window[:window.find(filename)+1] else ids[0]
                      chosen_base = final.split('/files/')[0]
                      break
              if not file_id:
                  # Fallback: use the CurseForge project mirror metadata to discover the exact file page.
                  raw, _ = get('https://modpacks.ch/mods/minecraft/1619996/doxleaning-tacz-recommendation')
                  text = raw.decode('utf-8', 'ignore')
                  pos = text.find(filename)
                  if pos >= 0:
                      window = text[max(0, pos-10000):pos+10000]
                      m = re.search(r'https://www\.curseforge\.com/minecraft/mc-mods/[^\"\'<> ]+/files/(\d+)', window)
                      if m:
                          file_id = m.group(1)
              if not file_id:
                  raise RuntimeError(f'Could not discover CurseForge file id for {filename}')
              candidates = [
                  f'https://www.curseforge.com/api/v1/mods/1619996/files/{file_id}/download',
                  f'https://www.curseforge.com/minecraft/mc-mods/doxleaning-tacz-recommendation/files/{file_id}/download',
              ]
              last = None
              for url in candidates:
                  try:
                      data, _ = get(url)
                      if data.startswith(b'PK'):
                          return data
                      last = RuntimeError(f'Non-JAR response from {url}')
                  except Exception as e:
                      last = e
              raise last or RuntimeError('DoxLean download failed')

          downloads = {
              'taczadditions-1.20.1-1.3.5.jar': modrinth('tacz-additions', 'taczadditions-1.20.1-1.3.5.jar'),
              'nomindlessshooting-2.3.0-1.20.1.jar': modrinth('no-mindless-shooting', 'nomindlessshooting-2.3.0-1.20.1.jar'),
              'doxlean-1.3.0.jar': curseforge_doxlean('doxlean-1.3.0.jar'),
          }

          for name, data in downloads.items():
              size = len(data)
              sha = hashlib.sha256(data).hexdigest()
              exp_size, exp_sha = expected[name]
              print(f'{name}: size={size} sha256={sha}')
              if size != exp_size or sha != exp_sha:
                  raise RuntimeError(f'{name} differs from the uploaded JAR; refusing to publish')
              (MODS / name).write_bytes(data)

          entries = []
          for name, (size, sha) in expected.items():
              entries.append({
                  'path': f'mods/{name}',
                  'url': f'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/{name}',
                  'size': size,
                  'sha256': sha,
              })

          settings_path = ROOT / 'pack-settings.json'
          settings = json.loads(settings_path.read_text(encoding='utf-8'))
          ext = settings.setdefault('external_files', [])
          by_path = {e.get('path'): e for e in ext if isinstance(e, dict)}
          for e in entries:
              if e['path'] in by_path:
                  by_path[e['path']].update(e)
              else:
                  ext.append(e)
          settings_path.write_text(json.dumps(settings, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = ROOT / 'pack.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.setdefault('files', [])
          by_path = {e.get('path'): e for e in files if isinstance(e, dict)}
          for e in entries:
              me = {**e, 'mode': 'replace'}
              if e['path'] in by_path:
                  by_path[e['path']].update(me)
              else:
                  files.append(me)
          manifest['version'] = '2026.09.30-mods-1'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

      - name: Commit mods and launcher manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/taczadditions-1.20.1-1.3.5.jar \
                  mods/nomindlessshooting-2.3.0-1.20.1.jar \
                  mods/doxlean-1.3.0.jar \
                  pack-settings.json pack.json
          git rm .github/workflows/import-uploaded-mods.yml
          git commit -m "feat: add TaCZ Additions, No Mindless Shooting and DoxLean"
          git push
