name: Rebuild Nuovo Ordine Core for Java 17

on:
  push:
    paths:
      - '.github/workflows/rebuild-core-java17.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild Core bytecode for Java 17
        shell: bash
        run: |
          set -euo pipefail
          JAR='mods/nuovo-ordine-core-0.2.2.jar'
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/unpack" "$TMP/decompiled" "$TMP/classes" "$TMP/stub/net/minecraftforge/fml/common"

          unzip -q "$JAR" -d "$TMP/unpack"

          curl -fsSL 'https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar' -o "$TMP/cfr.jar"
          java -jar "$TMP/cfr.jar" "$JAR" --outputdir "$TMP/decompiled" --silent true

          cat > "$TMP/stub/net/minecraftforge/fml/common/Mod.java" <<'EOF'
          package net.minecraftforge.fml.common;
          import java.lang.annotation.ElementType;
          import java.lang.annotation.Retention;
          import java.lang.annotation.RetentionPolicy;
          import java.lang.annotation.Target;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface Mod { String value(); }
          EOF

          javac --release 17 -d "$TMP/classes" \
            "$TMP/stub/net/minecraftforge/fml/common/Mod.java" \
            "$TMP/decompiled/it/nuovoordine/core/NuovoOrdineCoreMod.java"

          rm -rf "$TMP/classes/net"
          rm -rf "$TMP/unpack/it/nuovoordine/core"
          mkdir -p "$TMP/unpack/it/nuovoordine"
          cp -R "$TMP/classes/it/nuovoordine/core" "$TMP/unpack/it/nuovoordine/core"

          rm -f "$TMP/new.jar"
          jar --create --file "$TMP/new.jar" -C "$TMP/unpack" .

          MAJOR="$(javap -verbose -classpath "$TMP/new.jar" it.nuovoordine.core.NuovoOrdineCoreMod | awk '/major version:/ {print $3; exit}')"
          echo "NuovoOrdineCoreMod major version: $MAJOR"
          test "$MAJOR" = '61'

          mv "$TMP/new.jar" "$JAR"

      - name: Update launcher manifest hash and size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          jar = Path('mods/nuovo-ordine-core-0.2.2.jar')
          pack = Path('pack.json')
          raw = jar.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          size = len(raw)

          data = json.loads(pack.read_text(encoding='utf-8'))
          files = data.setdefault('files', [])
          files[:] = [x for x in files if not x.get('path', '').startswith('mods/nuovo-ordine-core-')]
          files.append({
              'path': 'mods/nuovo-ordine-core-0.2.2.jar',
              'size': size,
              'sha256': sha,
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/nuovo-ordine-core-0.2.2.jar'
          })
          data['version'] = '2026.10.01-core-0.2.2-java17-r3'
          pack.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('size=', size)
          print('sha256=', sha)
          PY

      - name: Commit Java 17 Core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/nuovo-ordine-core-0.2.2.jar pack.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Nuovo Ordine Core for Java 17'
          git push
