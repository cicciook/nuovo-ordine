name: Rebuild Nuovo Ordine Core for Java 17

on:
  push:
    paths:
      - '.github/workflows/rebuild-core-java17.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified Java 17 Core JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='mods/nuovo-ordine-core-0.2.2.jar'
          FIXED="$(mktemp --suffix=.jar)"

          cat .github/core-java17-parts/part00.txt \
              .github/core-java17-parts/part01.txt \
              .github/core-java17-parts/part02.txt \
              .github/core-java17-parts/part03.txt | base64 -d > "$FIXED"

          test "$(stat -c %s "$FIXED")" = '18794'
          test "$(sha256sum "$FIXED" | awk '{print $1}')" = '303babbe4e7b20a328cd9df862d7fc53cb16d17da517ac1b18878e882bface8d'
          unzip -t "$FIXED"

          MAJOR="$(javap -verbose -classpath "$FIXED" it.nuovoordine.core.NuovoOrdineCoreMod | awk '/major version:/ {print $3; exit}')"
          echo "NuovoOrdineCoreMod major version: $MAJOR"
          test "$MAJOR" = '61'

          mv "$FIXED" "$JAR"

      - name: Update launcher manifest hash and size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          jar = Path('mods/nuovo-ordine-core-0.2.2.jar')
          pack = Path('pack.json')
          raw = jar.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          size = len(raw)

          assert size == 18794, size
          assert sha == '303babbe4e7b20a328cd9df862d7fc53cb16d17da517ac1b18878e882bface8d', sha

          data = json.loads(pack.read_text(encoding='utf-8'))
          files = data.setdefault('files', [])
          files[:] = [x for x in files if not x.get('path', '').startswith('mods/nuovo-ordine-core-')]
          files.append({
              'path': 'mods/nuovo-ordine-core-0.2.2.jar',
              'size': size,
              'sha256': sha,
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/nuovo-ordine-core-0.2.2.jar'
          })
          data['version'] = '2026.10.01-core-0.2.2-java17-r3'
          pack.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('size=', size)
          print('sha256=', sha)
          PY

      - name: Commit Java 17 Core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/core-java17-parts
          git add mods/nuovo-ordine-core-0.2.2.jar pack.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Nuovo Ordine Core for Java 17'
          git push
