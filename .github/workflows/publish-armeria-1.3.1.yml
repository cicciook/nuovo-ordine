name: Pubblica Armeria Browser 1.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-armeria-1.3.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recupera base e sorgenti hotfix
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/cicciook/nuovo-ordine/afcabcc1143db14b52792fc58543db10dd456e0f/mods/armeria-browser-1.2.1.jar" \
            -o /tmp/armeria-base.jar
          curl -fsSL --retry 3 \
            "https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar" \
            -o /tmp/gson.jar

          cat > /tmp/ShopService.java.gz.b64 <<'B64'
          
          B64
          cat > /tmp/shop.html.gz.b64 <<'B64'
          
          B64
          cat > /tmp/mods.toml.gz.b64 <<'B64'
          
          B64

          base64 -d /tmp/ShopService.java.gz.b64 | gzip -d > /tmp/ShopService.java
          base64 -d /tmp/shop.html.gz.b64 | gzip -d > /tmp/shop.html
          base64 -d /tmp/mods.toml.gz.b64 | gzip -d > /tmp/mods.toml

      - name: Compila hotfix Mohist Gson
        run: |
          set -euo pipefail
          mkdir -p /tmp/classes
          javac --release 17 \
            -cp /tmp/armeria-base.jar:/tmp/gson.jar \
            -d /tmp/classes \
            /tmp/ShopService.java

      - name: Costruisci Armeria 1.3.1
        run: |
          set -euo pipefail
          mkdir -p mods
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          base = Path('/tmp/armeria-base.jar')
          out = Path('mods/armeria-browser-1.3.1.jar')
          classes = Path('/tmp/classes')
          source = Path('/tmp/ShopService.java').read_bytes()
          html = Path('/tmp/shop.html').read_bytes()
          toml = Path('/tmp/mods.toml').read_bytes()

          def skip(name):
              return (
                  name.startswith('com/armeria/ShopService') or
                  name.startswith('com/armeria/AddonCatalog') or
                  name == 'META-INF/armeria-sources/com/armeria/ShopService.java' or
                  name == 'META-INF/armeria-sources/com/armeria/AddonCatalog.java' or
                  name == 'armeria_addons.json' or
                  name == 'armeria_default/shop.html' or
                  name == 'META-INF/mods.toml' or
                  name == 'LEGGIMI-ARMERIA.txt'
              )

          with zipfile.ZipFile(base, 'r') as zin, zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zout:
              seen = set()
              for info in zin.infolist():
                  if info.is_dir() or skip(info.filename) or info.filename in seen:
                      continue
                  seen.add(info.filename)
                  zout.writestr(info.filename, zin.read(info.filename))

              for cls in sorted((classes/'com/armeria').glob('ShopService*.class')):
                  arc = cls.relative_to(classes).as_posix()
                  zout.write(cls, arc)
                  seen.add(arc)

              zout.writestr('META-INF/armeria-sources/com/armeria/ShopService.java', source)
              zout.writestr('armeria_default/shop.html', html)
              zout.writestr('META-INF/mods.toml', toml)
              zout.writestr('LEGGIMI-ARMERIA.txt',
                  'Armeria Browser 1.3.1 - Nuovo Ordine\n'
                  'Hotfix Mohist/Gson per caricamento catalogo e prezzi.\n'
                  'Installare lo stesso JAR su server e client, rimuovendo le versioni precedenti.\n'
              )
          PY

          unzip -t mods/armeria-browser-1.3.1.jar | tail -1
          javap -classpath mods/armeria-browser-1.3.1.jar -verbose com.armeria.ShopService > /tmp/javap.txt
          grep -F 'addProperty:(Ljava/lang/String;Ljava/lang/Boolean;)V' /tmp/javap.txt
          if grep -Fq 'addProperty:(Ljava/lang/String;Z)V' /tmp/javap.txt; then
            echo "Firma Gson primitiva non compatibile trovata" >&2
            exit 1
          fi

      - name: Aggiorna manifest launcher
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path.cwd()
          jar = root/'mods/armeria-browser-1.3.1.jar'
          data = jar.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          entry = {
              'path': 'mods/armeria-browser-1.3.1.jar',
              'size': len(data),
              'sha256': sha,
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/armeria-browser-1.3.1.jar'
          }
          news = 'Nuovo Ordine — Armeria 1.3.1: fix Mohist/Gson, catalogo oggetti e prezzi ripristinati.'

          settings_path = root/'pack-settings.json'
          settings = json.loads(settings_path.read_text('utf-8'))
          ext = settings.setdefault('external_files', [])
          settings['external_files'] = [
              x for x in ext if not x.get('path','').startswith('mods/armeria-browser-')
          ] + [entry]
          settings['news'] = news
          settings_path.write_text(json.dumps(settings, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          pack_path = root/'pack.json'
          pack = json.loads(pack_path.read_text('utf-8'))
          pack['version'] = '2026.10.03-armeria-hotfix-25'
          pack['news'] = news
          pack['files'] = [
              x for x in pack.get('files', [])
              if not x.get('path','').startswith('mods/armeria-browser-')
          ] + [entry]

          seen = {}
          unique = []
          for x in pack['files']:
              k = x['path'].casefold()
              if k in seen:
                  continue
              seen[k] = True
              unique.append(x)
          pack['files'] = unique

          pack_path.write_text(json.dumps(pack, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          assert [x['path'] for x in settings['external_files'] if x['path'].startswith('mods/armeria-browser-')] == [entry['path']]
          assert [x['path'] for x in pack['files'] if x['path'].startswith('mods/armeria-browser-')] == [entry['path']]
          print('Armeria:', entry['path'], entry['size'], entry['sha256'])
          PY

      - name: Pubblica
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/armeria-browser-1.3.1.jar pack.json pack-settings.json
          git commit -m 'Distribuisce Armeria Browser 1.3.1 fix prezzi e catalogo'
          git push origin HEAD:main
