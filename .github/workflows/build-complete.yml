name: Build Nuovo Ordine Complete

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/nuovo-ordine-complete-1.0.0/**'
      - '.github/workflows/build-complete.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile server-only mod
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=projects/nuovo-ordine-complete-1.0.0
          rm -rf "$PROJECT/build"
          mkdir -p "$PROJECT/build/stub-src/net/minecraftforge/fml/common" "$PROJECT/build/stub-classes" "$PROJECT/build/classes"
          cat > "$PROJECT/build/stub-src/net/minecraftforge/fml/common/Mod.java" <<'JAVA'
          package net.minecraftforge.fml.common;
          import java.lang.annotation.*;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface Mod { String value(); }
          JAVA
          # Compile the tiny Forge annotation stub into a SEPARATE classpath folder.
          # It must never be packaged into the released JAR.
          javac --release 17 -d "$PROJECT/build/stub-classes" "$PROJECT/build/stub-src/net/minecraftforge/fml/common/Mod.java"
          find "$PROJECT/src/main/java" -name '*.java' -print0 | xargs -0 javac --release 17 --add-modules jdk.httpserver -cp "$PROJECT/build/stub-classes" -d "$PROJECT/build/classes"
          cp -R "$PROJECT/src/main/resources/." "$PROJECT/build/classes/"
          mkdir -p mods
          jar --create --file mods/nuovo-ordine-complete-1.0.0.jar -C "$PROJECT/build/classes" .
          unzip -t mods/nuovo-ordine-complete-1.0.0.jar
          if jar tf mods/nuovo-ordine-complete-1.0.0.jar | grep -q '^net/minecraftforge/'; then
            echo 'Forge compile stub leaked into release JAR' >&2
            exit 1
          fi
          javap -verbose -classpath mods/nuovo-ordine-complete-1.0.0.jar it.nuovoordine.complete.NuovoOrdineCompleteMod | grep 'major version: 61'
      - name: Dedicated Forge mod-loading smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nuovoordine-complete-smoke
          mkdir -p /tmp/nuovoordine-complete-smoke
          cd /tmp/nuovoordine-complete-smoke
          curl -fLsS https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.13/forge-1.20.1-47.4.13-installer.jar -o installer.jar
          java -jar installer.jar --installServer > install.log 2>&1
          mkdir -p mods
          cp "$GITHUB_WORKSPACE/mods/nuovo-ordine-complete-1.0.0.jar" mods/
          printf 'eula=false\n' > eula.txt
          set +e
          timeout 120 bash run.sh nogui > smoke.log 2>&1
          status=$?
          set -e
          cat smoke.log
          if [ "$status" -eq 124 ]; then echo 'Forge smoke test timed out' >&2; exit 1; fi
          if grep -E 'Failed to create mod instance|ModLoadingException|NoClassDefFoundError|MixinApplyError|InvalidMixinException|ExceptionInInitializerError' smoke.log; then
            exit 1
          fi
          grep -qi 'agree to the EULA' smoke.log
      - name: Update launcher manifests
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          jar = Path('mods/nuovo-ordine-complete-1.0.0.jar')
          data = jar.read_bytes()
          entry = {
              'path': str(jar).replace('\\','/'),
              'size': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/nuovo-ordine-complete-1.0.0.jar',
          }
          managed_prefixes = ('mods/nuovo-ordine-complete-', 'mods/nuovo-ordine-gameplay-')
          for filename, key in [('pack.json','files'), ('pack-settings.json','external_files')]:
              path = Path(filename)
              doc = json.loads(path.read_text(encoding='utf-8'))
              doc[key] = [x for x in doc.get(key,[]) if not x.get('path','').startswith(managed_prefixes)] + [entry]
              if filename == 'pack.json':
                  doc['version'] = '2026.10.01-complete-1.0.0'
                  doc['news'] = 'Nuovo Ordine — territori, eventi, contratti, reputazione, ferite, convogli, airdrop, garage/usato e classifiche live'
              path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit verified artifact
        shell: bash
        run: |
          set -euo pipefail
          # Other Nuovo Ordine workflows also publish into pack.json. Refresh from
          # main first, then regenerate our manifest entry on top of the newest
          # branch state so concurrent launcher/suite commits cannot create a
          # stale-manifest rebase conflict.
          cp mods/nuovo-ordine-complete-1.0.0.jar /tmp/nuovo-ordine-complete-1.0.0.jar
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nuovo-ordine-complete-1.0.0.jar mods/nuovo-ordine-complete-1.0.0.jar

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          jar = Path('mods/nuovo-ordine-complete-1.0.0.jar')
          data = jar.read_bytes()
          entry = {
              'path': str(jar).replace('\\','/'),
              'size': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/nuovo-ordine-complete-1.0.0.jar',
          }
          managed_prefixes = ('mods/nuovo-ordine-complete-', 'mods/nuovo-ordine-gameplay-')
          for filename, key in [('pack.json','files'), ('pack-settings.json','external_files')]:
              path = Path(filename)
              doc = json.loads(path.read_text(encoding='utf-8'))
              doc[key] = [x for x in doc.get(key,[]) if not x.get('path','').startswith(managed_prefixes)] + [entry]
              if filename == 'pack.json':
                  doc['version'] = '2026.10.03-complete-1.0.0'
                  doc['news'] = 'Nuovo Ordine — fix compatibilità sparo TaCZ/Mohist e aggiornamenti gameplay'
              path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/nuovo-ordine-complete-1.0.0.jar pack.json pack-settings.json
          if git diff --cached --quiet; then
            echo 'Artifact and manifests already current.'
          else
            git commit -m 'release: Nuovo Ordine Complete 1.0.0'
            git push origin HEAD:main
          fi
