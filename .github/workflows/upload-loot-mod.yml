name: Aggiorna mod loot tattico

on:
  push:
    branches: [main]
    paths:
      - '.github/loot-upload/ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loot-mod:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ricostruisci JAR loot 1.1.13
        shell: bash
        run: |
          set -euo pipefail
          compgen -G '.github/loot-upload/part*.b64' > /dev/null
          mkdir -p mods
          cat .github/loot-upload/part*.b64 | base64 --decode > mods/lootr-more-tactical-loot-1.1.13.jar
          echo '1967266b3f4a0b8c5130616f1bf3037c38996ecc102d8bfcba5b3b70279b6ae0  mods/lootr-more-tactical-loot-1.1.13.jar' | sha256sum -c -
          find mods -maxdepth 1 -type f -name 'lootr-more-tactical-loot-*.jar' ! -name 'lootr-more-tactical-loot-1.1.13.jar' -delete
          rm -rf .github/loot-upload

      - name: Aggiorna pack-settings e pack.json
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          rel = 'mods/lootr-more-tactical-loot-1.1.13.jar'
          jar = Path(rel)
          data = jar.read_bytes()
          item = {
              'path': rel,
              'size': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/' + rel,
          }

          settings_path = Path('pack-settings.json')
          settings = json.loads(settings_path.read_text('utf-8'))
          external = [
              old for old in settings.get('external_files', [])
              if not (
                  old.get('path', '').startswith('mods/lootr-more-tactical-loot-')
                  and old.get('path', '').endswith('.jar')
              )
          ]
          external.append(item)
          settings['external_files'] = external
          settings['news'] = 'Nuovo Ordine — loot 1.1.13: fix LesRaisins, granate più comuni, C4 escluso'
          settings_path.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pack_path = Path('pack.json')
          pack = json.loads(pack_path.read_text('utf-8'))
          files = [
              old for old in pack.get('files', [])
              if not (
                  old.get('path', '').startswith('mods/lootr-more-tactical-loot-')
                  and old.get('path', '').endswith('.jar')
              )
          ]
          files.append(item)
          pack['files'] = files
          pack['version'] = datetime.now(timezone.utc).strftime('%Y.%m.%d') + '-loot-1.1.13'
          pack['news'] = settings['news']
          pack_path.write_text(json.dumps(pack, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Pubblica mod e manifest
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna loot mod alla 1.1.13 con fix LesRaisins'
          git push
