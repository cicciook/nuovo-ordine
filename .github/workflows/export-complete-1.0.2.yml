name: Export Complete 1.0.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-complete-1.0.2.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JAR
        run: |
          test -s mods/nuovo-ordine-complete-1.0.2.jar
          unzip -t mods/nuovo-ordine-complete-1.0.2.jar >/dev/null
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nuovo-ordine-complete-1.0.2
          path: mods/nuovo-ordine-complete-1.0.2.jar
          if-no-files-found: error
