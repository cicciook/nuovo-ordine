name: Pubblica Armeria Browser 1.3.11

on:
  push:
    branches: [main]
    paths:
      - 'projects/armeria-browser-1.3.5/**'
      - '.github/workflows/publish-armeria-1.3.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Usa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara dipendenze di compilazione
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/armeria-libs /tmp/armeria-classes /tmp/armeria-patch/META-INF/armeria-sources/com/armeria /tmp/armeria-patch/armeria_default /tmp/armeria-patch/META-INF
          curl -fL --retry 4 -o /tmp/armeria-libs/gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar
          curl -fL --retry 4 -o /tmp/armeria-libs/netty-buffer.jar https://repo1.maven.org/maven2/io/netty/netty-buffer/4.1.82.Final/netty-buffer-4.1.82.Final.jar
          curl -fL --retry 4 -o /tmp/armeria-libs/netty-common.jar https://repo1.maven.org/maven2/io/netty/netty-common/4.1.82.Final/netty-common-4.1.82.Final.jar

      - name: Compila hotfix bridge e catalogo
        shell: bash
        run: |
          set -euo pipefail
          BASE=mods/armeria-browser-1.3.10.jar
          test -s "$BASE"
          CP="$BASE:/tmp/armeria-libs/gson.jar:/tmp/armeria-libs/netty-buffer.jar:/tmp/armeria-libs/netty-common.jar"
          javac --release 17 -cp "$CP" -d /tmp/armeria-classes             projects/armeria-browser-1.3.5/src/com/armeria/Network.java             projects/armeria-browser-1.3.5/src/com/armeria/ShopBrowserClient.java             projects/armeria-browser-1.3.5/src/com/armeria/ShopService.java             projects/armeria-browser-1.3.5/src/com/armeria/BrowserBridge.java             projects/armeria-browser-1.3.5/src/com/armeria/SiteArchive.java             projects/armeria-browser-1.3.5/src/com/armeria/AmmoSupport.java             projects/armeria-browser-1.3.5/src/com/armeria/ShopRuntime.java

      - name: Costruisci JAR 1.3.11
        shell: bash
        run: |
          set -euo pipefail
          BASE=mods/armeria-browser-1.3.10.jar
          OUT=mods/armeria-browser-1.3.11.jar
          cp "$BASE" "$OUT"

          cp projects/armeria-browser-1.3.5/src/com/armeria/*.java /tmp/armeria-patch/META-INF/armeria-sources/com/armeria/
          cp projects/armeria-browser-1.3.5/resources/armeria_default/shop.html /tmp/armeria-patch/armeria_default/shop.html
          cp projects/armeria-browser-1.3.5/README.md /tmp/armeria-patch/META-INF/armeria-1.3.11-README.md

          unzip -p "$BASE" META-INF/mods.toml > /tmp/armeria-patch/META-INF/mods.toml
          sed -i 's/version="1\.3\.10"/version="1.3.11"/' /tmp/armeria-patch/META-INF/mods.toml
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/armeria-patch/META-INF/mods.toml')
          s=p.read_text('utf-8')
          s=s.replace('TheNewEconomy','EssentialsX Economy').replace('TNE','EssentialsX Economy')
          p.write_text(s,encoding='utf-8')
          PY

          jar uf "$OUT" -C /tmp/armeria-classes com/armeria
          jar uf "$OUT" -C /tmp/armeria-patch META-INF/armeria-sources
          jar uf "$OUT" -C /tmp/armeria-patch armeria_default/shop.html
          jar uf "$OUT" -C /tmp/armeria-patch META-INF/mods.toml
          jar uf "$OUT" -C /tmp/armeria-patch META-INF/armeria-1.3.11-README.md

          test "$(unzip -p "$OUT" META-INF/mods.toml | grep -c 'version="1.3.11"')" = 1
          unzip -p "$OUT" armeria_default/shop.html | grep -q '__ARMERIA_132_REQ__' || true
          test -s "$OUT"

      - name: Verifica JAR 1.3.11
        shell: bash
        run: |
          set -euo pipefail
          JAR=mods/armeria-browser-1.3.11.jar
          unzip -t "$JAR" >/dev/null
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="1.3.11"'
          unzip -p "$JAR" armeria_default/shop.html | grep -q 'EssentialsX'
          unzip -p "$JAR" armeria_default/shop.html | grep -q 'nuovo-ordine-armeria-default:1.3.11'
          unzip -p "$JAR" armeria_default/shop.html | grep -q 'id="vImage"'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'sightCategory'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'row.addProperty("image"'
          ! unzip -p "$JAR" armeria_default/shop.html | grep -Eq 'TheNewEconomy|Pagamento TNE|/ Vault'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopRuntime.java | grep -q 'EssentialsX Economy'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopRuntime.java | grep -q 'com.earth2me.essentials.api.Economy'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'calibratedCategory'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'v.equals("attachment")'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/SiteArchive.java | grep -q 'shop.pre-1.3.11.bak'
          unzip -p "$JAR" armeria_default/shop.html | grep -q 'option value="Mirini"'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'return "Mirini"'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'Compatibilità armi:'
          unzip -p "$JAR" META-INF/armeria-sources/com/armeria/ShopService.java | grep -q 'purchaseQuantity = sightCategory'
          javap -classpath "$JAR:/tmp/armeria-libs/gson.jar:/tmp/armeria-libs/netty-buffer.jar:/tmp/armeria-libs/netty-common.jar" -p com.armeria.ShopRuntime | grep -q 'receive'
          sha256sum "$JAR"

      - name: Esporta JAR Armeria 1.3.11
        uses: actions/upload-artifact@v4
        with:
          name: armeria-browser-1.3.11
          path: mods/armeria-browser-1.3.11.jar
          if-no-files-found: error

      - name: Aggiorna manifest launcher senza perdere il pack completo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          jar=Path('mods/armeria-browser-1.3.11.jar')
          data=jar.read_bytes()
          item={
              'path':'mods/armeria-browser-1.3.11.jar',
              'size':len(data),
              'sha256':hashlib.sha256(data).hexdigest(),
              'mode':'replace',
              'url':'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/armeria-browser-1.3.11.jar',
          }

          settings_path=Path('pack-settings.json')
          settings=json.loads(settings_path.read_text('utf-8'))
          external=[]
          inserted=False
          for old in settings.get('external_files',[]):
              p=old.get('path','')
              if re.fullmatch(r'mods/armeria-browser-[^/]+\.jar',p):
                  if not inserted:
                      external.append(item); inserted=True
              else:
                  external.append(old)
          if not inserted: external.append(item)
          settings['external_files']=external
          settings['news']='Nuovo Ordine — Armeria 1.3.11: i mirini si acquistano singolarmente e mostrano le categorie di armi compatibili.'
          settings_path.write_text(json.dumps(settings,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pack_path=Path('pack.json')
          raw=pack_path.read_text('utf-8').strip() if pack_path.exists() else ''
          if raw:
              pack=json.loads(raw)
          else:
              baseline='https://github.com/cicciook/nuovo-ordine/releases/download/pack-2026.09.27-1/pack.json'
              with urllib.request.urlopen(baseline,timeout=120) as response:
                  pack=json.load(response)

          excluded=set(settings.get('exclude_paths',[]))
          current=[x for x in pack.get('files',[]) if x.get('path') not in excluded]

          families=[
              r'mods/nuovo-ordine-quests-[^/]+\.jar',
              r'mods/lootr-more-tactical-loot-[^/]+\.jar',
              r'mods/ammocompat-[^/]+\.jar',
              r'mods/armeria-browser-[^/]+\.jar',
          ]
          for pattern in families:
              wanted={x['path'] for x in external if re.fullmatch(pattern,x.get('path',''))}
              if wanted:
                  current=[x for x in current if not re.fullmatch(pattern,x.get('path','')) or x.get('path') in wanted]

          by_path={x['path']:x for x in current}
          for x in external: by_path[x['path']]=x
          ordered=[]; seen=set()
          for x in current:
              p=x['path']
              if p not in seen:
                  ordered.append(by_path[p]); seen.add(p)
          for x in external:
              p=x['path']
              if p not in seen:
                  ordered.append(x); seen.add(p)

          pack['schema']=1
          pack['minecraft']=settings['minecraft']
          pack['forge']=settings['forge']
          pack['server']=settings.get('server','')
          pack['files']=ordered
          pack['news']=settings['news']
          pack['version']=datetime.now(timezone.utc).strftime('%Y.%m.%d')+'-armeria-1.3.11'
          pack_path.write_text(json.dumps(pack,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm -f mods/armeria-browser-1.3.10.jar

      - name: Valida manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from launcher.updater import validate_manifest
          p=json.load(open('pack.json',encoding='utf-8'))
          validate_manifest(p)
          paths=[x['path'] for x in p['files']]
          assert 'mods/armeria-browser-1.3.11.jar' in paths
          assert not any(x.startswith('mods/armeria-browser-1.3.10') for x in paths)
          print('Manifest valido:',len(paths),'file')
          PY

      - name: Pubblica Armeria 1.3.11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/armeria-browser-1.3.11.jar mods/armeria-browser-1.3.10.jar pack-settings.json pack.json
          git commit -m 'Pubblica Armeria Browser 1.3.11' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
