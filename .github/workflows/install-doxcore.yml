name: Install DoxCore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-doxcore.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DoxCore 1.0.1
        run: |
          mkdir -p mods
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://www.curseforge.com/api/v1/mods/1620049/files/8497593/download' \
            -o mods/doxcore-1.0.1.jar
          python - <<'PY'
          from pathlib import Path
          p=Path('mods/doxcore-1.0.1.jar')
          data=p.read_bytes()
          if not data.startswith(b'PK'):
              raise SystemExit('Downloaded file is not a JAR/ZIP')
          print('Downloaded', p, len(data), 'bytes')
          PY

      - name: Update launcher manifests
        shell: python
        run: |
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          jar = root / 'mods' / 'doxcore-1.0.1.jar'
          data = jar.read_bytes()
          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          entry = {
              'path': 'mods/doxcore-1.0.1.jar',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/doxcore-1.0.1.jar',
              'size': size,
              'sha256': sha,
              'mode': 'replace',
          }

          settings_path = root / 'pack-settings.json'
          settings = json.loads(settings_path.read_text(encoding='utf-8'))
          ext = settings.setdefault('external_files', [])
          old = next((x for x in ext if isinstance(x, dict) and x.get('path') == entry['path']), None)
          if old:
              old.update(entry)
          else:
              ext.append(entry)
          settings_path.write_text(json.dumps(settings, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = root / 'pack.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.setdefault('files', [])
          old = next((x for x in files if isinstance(x, dict) and x.get('path') == entry['path']), None)
          if old:
              old.update(entry)
          else:
              files.append(entry)
          manifest['version'] = '2026.09.30-doxcore-1'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('sha256=', sha, 'size=', size)

      - name: Upload DoxCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxcore-1.0.1
          path: mods/doxcore-1.0.1.jar
          if-no-files-found: error

      - name: Commit DoxCore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/doxcore-1.0.1.jar pack-settings.json pack.json
          git rm .github/workflows/install-doxcore.yml
          git commit -m "fix: add DoxCore dependency for DoxLean"
          git push
