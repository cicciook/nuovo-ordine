name: Installa loot mod 1.1.15

on:
  push:
    branches: [main]
    paths:
      - '.github/loot-upload/ready115.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ricostruisci e valida JAR 1.1.15
        shell: bash
        run: |
          set -euo pipefail
          compgen -G '.github/loot-upload/part*.b64' > /dev/null
          mkdir -p mods
          cat .github/loot-upload/part*.b64 | base64 --decode > mods/lootr-more-tactical-loot-1.1.15.jar

          # Il checksum viene calcolato dai byte realmente ricostruiti. La build
          # precedente aveva un hash di staging errato pur avendo tutte le parti.
          jar tf mods/lootr-more-tactical-loot-1.1.15.jar >/dev/null
          unzip -p mods/lootr-more-tactical-loot-1.1.15.jar META-INF/mods.toml >/dev/null
          unzip -p mods/lootr-more-tactical-loot-1.1.15.jar META-INF/loot-update-source/Patch.java >/dev/null

          LOOT_SHA256="$(sha256sum mods/lootr-more-tactical-loot-1.1.15.jar | awk '{print $1}')"
          LOOT_SIZE="$(stat -c '%s' mods/lootr-more-tactical-loot-1.1.15.jar)"
          echo "LOOT_SHA256=$LOOT_SHA256" >> "$GITHUB_ENV"
          echo "LOOT_SIZE=$LOOT_SIZE" >> "$GITHUB_ENV"
          echo "JAR 1.1.15 valido: $LOOT_SIZE byte, sha256=$LOOT_SHA256"

          find mods -maxdepth 1 -type f -name 'lootr-more-tactical-loot-*.jar' ! -name 'lootr-more-tactical-loot-1.1.15.jar' -delete

      - name: Conserva i sorgenti della loot mod
        shell: bash
        run: |
          set -euo pipefail
          rm -rf loot-source/1.1.15
          mkdir -p loot-source/1.1.15
          python - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('mods/lootr-more-tactical-loot-1.1.15.jar')
          out = Path('loot-source/1.1.15')
          prefix = 'META-INF/loot-update-source/'
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if name.startswith(prefix) and not name.endswith('/'):
                      rel = name[len(prefix):]
                      target = out / rel
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(name))
          if not (out / 'Patch.java').is_file():
              raise SystemExit('Patch.java non estratto')
          PY

      - name: Aggiorna pack-settings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('pack-settings.json')
          settings = json.loads(path.read_text('utf-8'))
          item = {
              'path': 'mods/lootr-more-tactical-loot-1.1.15.jar',
              'size': int(os.environ['LOOT_SIZE']),
              'sha256': os.environ['LOOT_SHA256'],
              'mode': 'replace',
              'url': 'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/lootr-more-tactical-loot-1.1.15.jar',
          }

          external = []
          replaced = False
          for old in settings.get('external_files', []):
              p = old.get('path', '')
              if p.startswith('mods/lootr-more-tactical-loot-') and p.endswith('.jar'):
                  if not replaced:
                      external.append(item)
                      replaced = True
              else:
                  external.append(old)
          if not replaced:
              external.append(item)

          settings['external_files'] = external
          settings['news'] = 'Nuovo Ordine — loot 1.1.15: fix automatico TACZ/Mohist al login, LesRaisins e granate'
          path.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Pulisci upload temporaneo
        shell: bash
        run: |
          rm -rf .github/loot-upload

      - name: Pubblica aggiornamento
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna loot mod alla 1.1.15 con fix TACZ login'
          git pull --rebase origin main
          git push
