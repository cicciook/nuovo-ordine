name: Build Nuovo Ordine Complete shoot fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-complete-shootfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile fixed mod
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=projects/nuovo-ordine-complete-1.0.0
          rm -rf "$PROJECT/build"
          mkdir -p "$PROJECT/build/stub-src/net/minecraftforge/fml/common" "$PROJECT/build/stub-classes" "$PROJECT/build/classes"
          cat > "$PROJECT/build/stub-src/net/minecraftforge/fml/common/Mod.java" <<'JAVA'
          package net.minecraftforge.fml.common;
          import java.lang.annotation.*;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface Mod { String value(); }
          JAVA
          javac --release 17 -d "$PROJECT/build/stub-classes" "$PROJECT/build/stub-src/net/minecraftforge/fml/common/Mod.java"
          find "$PROJECT/src/main/java" -name '*.java' -print0 | xargs -0 javac --release 17 --add-modules jdk.httpserver -cp "$PROJECT/build/stub-classes" -d "$PROJECT/build/classes"
          cp -R "$PROJECT/src/main/resources/." "$PROJECT/build/classes/"
          mkdir -p mods
          jar --create --file mods/nuovo-ordine-complete-1.0.1.jar -C "$PROJECT/build/classes" .
          unzip -t mods/nuovo-ordine-complete-1.0.1.jar
          javap -classpath mods/nuovo-ordine-complete-1.0.1.jar -p -c it.nuovoordine.complete.NuovoOrdineCompleteMod > /tmp/nocomplete.txt
          grep -q 'serverShootNetworkCheck' /tmp/nocomplete.txt
          grep -q 'taczShootFixAttempts' /tmp/nocomplete.txt
          unzip -p mods/nuovo-ordine-complete-1.0.1.jar META-INF/mods.toml | grep 'version="1.0.1"'

      - name: Refresh manifests on latest main
        shell: bash
        run: |
          set -euo pipefail
          cp mods/nuovo-ordine-complete-1.0.1.jar /tmp/nuovo-ordine-complete-1.0.1.jar
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nuovo-ordine-complete-1.0.1.jar mods/nuovo-ordine-complete-1.0.1.jar

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          jar=Path('mods/nuovo-ordine-complete-1.0.1.jar')
          data=jar.read_bytes()
          entry={
              'path':'mods/'+jar.name,
              'size':len(data),
              'sha256':hashlib.sha256(data).hexdigest(),
              'mode':'replace',
              'url':'https://raw.githubusercontent.com/cicciook/nuovo-ordine/main/mods/'+jar.name,
          }
          prefixes=('mods/nuovo-ordine-complete-','mods/nuovo-ordine-gameplay-')
          for filename,key in [('pack.json','files'),('pack-settings.json','external_files')]:
              p=Path(filename)
              doc=json.loads(p.read_text('utf-8'))
              doc[key]=[x for x in doc.get(key,[]) if not x.get('path','').startswith(prefixes)]
              doc[key].append(entry)
              if filename=='pack.json':
                  doc['version']='2026.10.05-complete-1.0.1'
                  doc['news']='Nuovo Ordine — fix sparo TaCZ: non serve più un colpo melee prima di sparare'
              p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(entry)
          PY

          rm -f mods/nuovo-ordine-complete-1.0.0.jar

      - name: Commit fixed artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mods/nuovo-ordine-complete-1.0.0.jar mods/nuovo-ordine-complete-1.0.1.jar pack.json pack-settings.json
          git commit -m 'release: Nuovo Ordine Complete 1.0.1 shoot fix'
          git push origin HEAD:main
